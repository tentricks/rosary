    <div class="utility-bar"><div class="hand-toggle"><label><input id="left-handed" type="checkbox"><span>Left hand</span></label></div><div class="utility-actions"><button class="wake-toggle" id="wake-toggle" type="button" aria-pressed="false" aria-label="Keep screen awake" title="Keep the screen awake while praying"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="2.5" width="14" height="19" rx="2.2"/><path d="M9 18.5h6M12 6v5m-2-2 2 2 2-2"/></svg></button><button class="theme-toggle" id="theme-toggle" type="button" aria-pressed="true" aria-label="Switch to light mode"><svg id="sun-icon" viewBox="0 0 24 24" aria-hidden="true" hidden><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l-1.42 1.42m11.3-11.3 1.42-1.42"/></svg><svg id="moon-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 15.5A8.5 8.5 0 0 1 8.5 3.5 8.7 8.7 0 1 0 20.5 15.5Z"/></svg></button></div><span id="wake-status" class="sr-only" aria-live="polite"></span></div>
    <div class="workspace" id="workspace">
      <section class="panel prayer-panel" id="prayer" aria-labelledby="step-title">
        <div class="prayer-top"><span class="label" id="step-type">Opening prayers</span><span class="progress-text" id="progress-count">1 of 75</span></div>
        <div class="progress" role="progressbar" aria-label="Rosary progress" aria-valuemin="1" aria-valuemax="75" aria-valuenow="1"><span id="progress-fill" style="width:1.3%"></span></div>
        <div id="live-step" class="prayer-scroll" tabindex="0" aria-label="Current prayer text" aria-live="polite" aria-atomic="true">
          <h2 class="prayer-title" id="step-title">Sign of the Cross</h2>
          <p class="prayer-text" id="step-text"></p>
          <div class="scripture-links hidden" id="scripture-links" aria-label="Scripture readings"></div>
        </div>
        <button class="text-toggle" id="toggle-text" type="button" aria-expanded="true">Hide prayer text</button>
        <div class="spacer"></div>
        <div class="controls"><button class="btn secondary" id="previous" type="button">← Previous</button><button class="btn" id="next" type="button">Next prayer →</button></div>
        <div class="tools">
          <div class="size-tools" role="group" aria-label="Prayer text size"><button type="button" data-size="normal" aria-pressed="true" aria-label="Standard prayer text size">A</button><button type="button" data-size="large" aria-pressed="false" aria-label="Larger prayer text">A+</button><button type="button" data-size="larger" aria-pressed="false" aria-label="Largest prayer text">A++</button></div>
        </div>
      </section>
      <section class="panel rosary-panel" aria-labelledby="rosary-title">
        <div class="rail-head"><h2 id="rosary-title">Rosary</h2><span class="rail-count" id="rail-count"></span></div>
        <div class="rail-window" id="bead-rail" role="group" aria-label="Rosary beads"></div>
        <button class="reset-button" id="reset" type="button" aria-label="Reset to the Sign of the Cross" title="Reset to the Sign of the Cross"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.34-5.66L4 8"/><path d="M4 4v4h4"/></svg><span>Reset</span></button>
      </section>
    </div>

  </main>
  <script>
  (()=>{
    const mysteries={
      joyful:[['The Annunciation','The angel Gabriel announces to Mary that she will conceive the Son of God.'],['The Visitation','Mary visits her cousin Elizabeth, who recognizes the blessing she carries.'],['The Nativity','Jesus is born in Bethlehem and laid in a manger.'],['The Presentation','Mary and Joseph present the infant Jesus in the Temple.'],['The Finding in the Temple','After three days, Mary and Joseph find Jesus among the teachers.']],
      luminous:[['The Baptism of Jesus','Jesus is baptized in the Jordan, and the Father calls him beloved.'],['The Wedding at Cana','At Mary’s request, Jesus performs his first sign at a wedding feast.'],['The Proclamation of the Kingdom','Jesus proclaims the Kingdom of God and calls all to conversion.'],['The Transfiguration','Jesus is revealed in glory to Peter, James, and John.'],['The Institution of the Eucharist','Jesus gives himself to his disciples in the Eucharist.']],
      sorrowful:[['The Agony in the Garden','Jesus prays in Gethsemane and accepts the Father’s will.'],['The Scourging at the Pillar','Jesus is scourged before his crucifixion.'],['The Crowning with Thorns','Soldiers mock Jesus and place a crown of thorns upon him.'],['The Carrying of the Cross','Jesus carries his cross on the way to Calvary.'],['The Crucifixion','Jesus is crucified and gives his life.']],
      glorious:[['The Resurrection','Jesus rises from the dead.'],['The Ascension','The risen Jesus is taken up into heaven.'],['The Descent of the Holy Spirit','The Holy Spirit comes upon Mary and the apostles.'],['The Assumption of Mary','Mary is taken up, body and soul, into heavenly glory.'],['The Coronation of Mary','Mary is crowned Queen of Heaven and Earth.']]
    };
    const prayer={
      sign:{title:'Sign of the Cross',type:'Opening prayers',text:'In the name of the Father, and of the Son, and of the Holy Spirit. Amen.'},
      creed:{title:'Apostles’ Creed',type:'Opening prayers',text:'I believe in God, the Father almighty, Creator of heaven and earth, and in Jesus Christ, his only Son, our Lord, who was conceived by the Holy Spirit, born of the Virgin Mary, suffered under Pontius Pilate, was crucified, died and was buried; he descended into hell; on the third day he rose again from the dead; he ascended into heaven, and is seated at the right hand of God the Father almighty; from there he will come to judge the living and the dead.\n\nI believe in the Holy Spirit, the holy catholic Church, the communion of saints, the forgiveness of sins, the resurrection of the body, and life everlasting. Amen.'},
      our:{title:'Our Father',type:'Prayer',text:'Our Father, who art in heaven, hallowed be thy name; thy kingdom come; thy will be done on earth as it is in heaven. Give us this day our daily bread, and forgive us our trespasses, as we forgive those who trespass against us; and lead us not into temptation, but deliver us from evil. Amen.'},
      hail:{title:'Hail Mary',type:'Prayer',text:'Hail Mary, full of grace, the Lord is with thee. Blessed art thou among women, and blessed is the fruit of thy womb, Jesus.\n\nHoly Mary, Mother of God, pray for us sinners, now and at the hour of our death. Amen.'},
      glory:{title:'Glory Be',type:'Prayer',text:'Glory be to the Father, and to the Son, and to the Holy Spirit, as it was in the beginning, is now, and ever shall be, world without end. Amen.'},
      fatima:{title:'Fatima Prayer',type:'Prayer',text:'O my Jesus, forgive us our sins, save us from the fires of hell; lead all souls to heaven, especially those in most need of thy mercy. Amen.'},
      queen:{title:'Hail, Holy Queen',type:'Concluding prayers',text:'Hail, holy Queen, Mother of mercy, our life, our sweetness, and our hope. To thee do we cry, poor banished children of Eve; to thee do we send up our sighs, mourning and weeping in this valley of tears. Turn, then, most gracious advocate, thine eyes of mercy toward us, and after this our exile show unto us the blessed fruit of thy womb, Jesus. O clement, O loving, O sweet Virgin Mary.\n\nPray for us, O holy Mother of God.\nThat we may be made worthy of the promises of Christ.'},
      closing:{title:'Closing Prayer',type:'Concluding prayers',text:'Let us pray. O God, whose only-begotten Son, by his life, death, and resurrection, has purchased for us the rewards of eternal life, grant, we beseech thee, that meditating on these mysteries of the most holy Rosary of the Blessed Virgin Mary, we may imitate what they contain and obtain what they promise, through the same Christ our Lord. Amen.'},
    };
    const scriptureRefs={
      joyful:[[{label:'Luke 1:26–38',target:'Luke 1.26-38'}],[{label:'Luke 1:39–45',target:'Luke 1.39-45'}],[{label:'Luke 2:1–21',target:'Luke 2.1-21'}],[{label:'Luke 2:22–38',target:'Luke 2.22-38'}],[{label:'Luke 2:41–52',target:'Luke 2.41-52'}]],
      luminous:[[{label:'Luke 3:21–22',target:'Luke 3.21-22'}],[{label:'John 2:1–11',target:'John 2.1-11'}],[{label:'Matthew 5–7',target:'Matthew 5-7'}],[{label:'Luke 9:28–36',target:'Luke 9.28-36'}],[{label:'Luke 22:14–23',target:'Luke 22.14-23'}]],
      sorrowful:[[{label:'Luke 22:39–46',target:'Luke 22.39-46'}],[{label:'John 19:1',target:'John 19.1'}],[{label:'John 19:2',target:'John 19.2'}],[{label:'John 19:17',target:'John 19.17'}],[{label:'John 19:17–37',target:'John 19.17-37'}]],
      glorious:[[{label:'John 20:1–10',target:'John 20.1-10'},{label:'Matthew 28:1–8',target:'Matthew 28.1-8'}],[{label:'Acts 1:8–11',target:'Acts 1.8-11'}],[{label:'Acts 2:1–6',target:'Acts 2.1-6'}],[{label:'Catechism of the Catholic Church §966',url:'https://www.vatican.va/content/catechism/en/part_one/section_two/chapter_two/article_3.html'},{label:'Revelation 12:1–3',target:'Revelation 12.1-3'}],[{label:'1 Kings 2:19',target:'1 Kings 2.19'},{label:'Revelation 12:1–5',target:'Revelation 12.1-5'}]]
    };
    function scriptureUrl(ref){return ref.url||'https://biblia.com/books/RSV2CE/'+encodeURIComponent(ref.target)}
    function renderScriptureLinks(refs){const list=$('scripture-links');list.replaceChildren();refs.forEach(ref=>{const a=document.createElement('a');a.href=scriptureUrl(ref);a.target='_blank';a.rel='noopener noreferrer';a.textContent=ref.label+' ↗';a.setAttribute('aria-label',ref.label+(ref.url?' (opens in a new tab)':' in RSV-2CE (opens in a new tab)'));list.appendChild(a)})}
    const names=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
    const dayMystery=['glorious','joyful','sorrowful','glorious','luminous','sorrowful','joyful'];
    const now=new Date(),today=now.getDay(),dayName=names[today];let mystery=dayMystery[today];
    let steps=[];const nodeToStep=new Map();let orderedNodes=[];let activeNode='cross',index=0,textVisible=true,wakeLock=null,keepAwake=false;
    const safeStorage={get(k){try{return localStorage.getItem(k)}catch{return null}},set(k,v){try{localStorage.setItem(k,v)}catch{}}};
    const $=id=>document.getElementById(id);
    function addStep(data,node){const i=steps.length;steps.push({...data,node});if(!nodeToStep.has(node)){nodeToStep.set(node,i);orderedNodes.push({id:node,label:data.nodeLabel||node,stepIndex:i})}return i}
    function buildSteps(){steps=[];nodeToStep.clear();orderedNodes=[];
      addStep({key:'sign',nodeLabel:'cross'},'cross');addStep({key:'creed'},'cross');
      addStep({key:'our',nodeLabel:'first Our Father bead'},'intro-our');
      ['faith','hope','charity'].forEach((virtue,i)=>addStep({key:'hail',note:'For an increase of '+virtue+'.',nodeLabel:'introductory Hail Mary '+(i+1)},'intro-hail-'+(i+1)));
      addStep({key:'glory',nodeLabel:'introductory Glory Be bead'},'intro-glory');
      for(let d=0;d<5;d++){
        const start='decade-'+(d+1)+'-our';addStep({key:'mystery',decade:d,nodeLabel:'Mystery '+(d+1)+' Our Father bead'},start);addStep({key:'our',decade:d,nodeLabel:'Mystery '+(d+1)+' Our Father bead'},start);
        for(let n=1;n<=10;n++)addStep({key:'hail',decade:d,count:n,nodeLabel:'Mystery '+(d+1)+', Hail Mary bead '+n},'decade-'+(d+1)+'-hail-'+n);
        addStep({key:'glory',decade:d,nodeLabel:'Mystery '+(d+1)+', after the ten Hail Marys'},'decade-'+(d+1)+'-hail-10');
        addStep({key:'fatima',decade:d,nodeLabel:'Mystery '+(d+1)+', after the ten Hail Marys'},'decade-'+(d+1)+'-hail-10');
      }
      addStep({key:'queen',nodeLabel:'Fifth mystery, concluding prayers'},'decade-5-hail-10');addStep({key:'closing',nodeLabel:'Fifth mystery, concluding prayers'},'decade-5-hail-10');addStep({key:'sign',type:'Concluding prayers',nodeLabel:'cross'},'cross');
    }
    function renderRail(){const rail=$('bead-rail');let rows=Math.floor((window.innerHeight-180)/40);rows=Math.max(7,Math.min(11,rows));if(rows%2===0)rows--;rail.style.height=(rows*40)+'px';$('rail-count').textContent=(orderedNodes.findIndex(item=>item.id===activeNode)+1)+' / '+orderedNodes.length;
      let track=rail.querySelector('.rail-track'),firstRender=!track,oldTransform=track?track.style.transform:'translateY(0px)';if(!track){track=document.createElement('div');track.className='rail-track';rail.appendChild(track)}track.style.transform=oldTransform;track.replaceChildren();
      const layout=[];orderedNodes.forEach(item=>{const gap=item.id==='intro-hail-1'||item.id==='intro-glory'||/^decade-\d+-our$/.test(item.id)||/^decade-\d+-hail-1$/.test(item.id);if(gap)layout.push({gap:true});layout.push(item)});
      let y=0,currentY=0;const positionedButtons=[];const visual=layout.slice().reverse();visual.forEach(entry=>{if(entry.gap){const spacer=document.createElement('div');spacer.className='rail-gap';spacer.setAttribute('aria-hidden','true');track.appendChild(spacer);y+=10;return}
        const slot=document.createElement('div');slot.className='rail-slot';const current=entry.id===activeNode,decadeEnd=/^decade-\d+-hail-10$/.test(entry.id);const kind=entry.id==='cross'?'cross':entry.id==='intro-glory'||entry.id.endsWith('-our')?'large':'small';const button=document.createElement('button');button.type='button';button.className='rail-item '+kind+(decadeEnd?' decade-end':'')+(current?' current':'')+(entry.stepIndex<index?' done':'');button.setAttribute('aria-label',entry.label+(decadeEnd?', final bead of the decade':'')+(current?', current bead':''));if(current){button.setAttribute('aria-current','step');button.setAttribute('aria-pressed','true')}else button.setAttribute('aria-pressed','false');
        if(kind==='cross'){button.innerHTML='<svg class="rail-cross-icon" viewBox="0 0 48 56" aria-hidden="true"><path d="M18 2h12v16h16v12H30v24H18V30H2V18h16z"/></svg>'}else{const bead=document.createElement('span');bead.className='rail-bead';bead.setAttribute('aria-hidden','true');button.appendChild(bead)}
        button.addEventListener('click',()=>goTo(entry.stepIndex));slot.appendChild(button);track.appendChild(slot);positionedButtons.push({button,center:y+20});if(current)currentY=y+20;y+=40;
      });
      const target=(rail.clientHeight/2)-currentY;positionedButtons.forEach(x=>{const screenY=x.center+target;x.button.tabIndex=screenY>=0&&screenY<=rail.clientHeight?0:-1});if(firstRender){track.style.transition='none';track.style.transform='translateY('+target+'px)';void track.offsetHeight;track.style.transition=''}else{void track.offsetHeight;track.style.transform='translateY('+target+'px)'}
    }
    function goTo(i){index=Math.max(0,Math.min(i,steps.length-1));activeNode=steps[index].node;render()}
    function setTheme(theme){const dark=theme==='dark';document.documentElement.dataset.theme=dark?'dark':'light';$('theme-color-meta').content=dark?'#080b09':'#f4f1e9';$('sun-icon').hidden=!dark;$('moon-icon').hidden=dark;$('theme-toggle').setAttribute('aria-label',dark?'Switch to light mode':'Switch to dark mode');$('theme-toggle').setAttribute('aria-pressed',String(dark));}
    function updateWakeButton(){const button=$('wake-toggle');if(button.disabled)return;button.setAttribute('aria-pressed',String(keepAwake));button.setAttribute('aria-label',keepAwake?'Stop keeping the screen awake':'Keep screen awake');button.title=keepAwake?'Allow the screen to sleep':'Keep the screen awake while praying';button.classList.toggle('active',keepAwake)}
    async function requestWakeLock(){if(!keepAwake||document.visibilityState!=='visible'||!navigator.wakeLock)return;try{const sentinel=await navigator.wakeLock.request('screen');if(!keepAwake){await sentinel.release();return}wakeLock=sentinel;sentinel.addEventListener('release',()=>{if(wakeLock===sentinel)wakeLock=null;if(keepAwake&&document.visibilityState==='visible'){keepAwake=false;updateWakeButton();$('wake-status').textContent='Your browser released the screen lock.'}});$('wake-status').textContent='The screen will stay awake while this page is visible.'}catch(error){keepAwake=false;wakeLock=null;updateWakeButton();$('wake-status').textContent='This browser could not keep the screen awake.'}}
    async function toggleWakeLock(){if(keepAwake){keepAwake=false;const sentinel=wakeLock;wakeLock=null;if(sentinel)try{await sentinel.release()}catch{}updateWakeButton();$('wake-status').textContent='The screen may sleep normally.';return}keepAwake=true;updateWakeButton();await requestWakeLock()}
    function render(){const s=steps[index],p=prayer[s.key];const mysteryIndex=s.decade!==undefined?s.decade:(s.type==='Concluding prayers'?4:0);const currentMystery=mysteries[mystery][mysteryIndex];
      const title=s.key==='mystery'?currentMystery[0]:s.key==='hail'&&s.count?'Hail Mary · '+s.count+' of 10':p.title;const type=s.key==='mystery'?'Mystery '+(mysteryIndex+1)+' · Scripture meditation (RSV-2CE)':p.type;const body=s.key==='mystery'?'Read the following passages in the Revised Standard Version, Second Catholic Edition:':p.text;
      $('step-title').textContent=title;$('step-type').textContent=type;$('step-text').textContent=body;$('step-text').classList.toggle('hidden',!textVisible);const readingLinks=$('scripture-links');if(s.key==='mystery')renderScriptureLinks(scriptureRefs[mystery][mysteryIndex]);readingLinks.classList.toggle('hidden',s.key!=='mystery'||!textVisible);$('toggle-text').textContent=textVisible?'Hide prayer text':'Show prayer text';$('toggle-text').setAttribute('aria-expanded',String(textVisible));
      $('current-mystery-title').textContent=(mysteryIndex+1)+'. '+currentMystery[0];$('current-mystery-description').textContent=currentMystery[1];
      $('progress-count').textContent=(index+1)+' of '+steps.length;$('progress-fill').style.width=((index+1)/steps.length*100)+'%';const bar=document.querySelector('[role=progressbar]');bar.setAttribute('aria-valuemax',steps.length);bar.setAttribute('aria-valuenow',index+1);$('previous').disabled=index===0;$('next').disabled=index===steps.length-1;$('next').textContent=index===steps.length-1?'Rosary complete ✓':'Next prayer →';activeNode=s.node;renderRail();$('live-step').scrollTop=0;safeStorage.set('rosary-step',String(index));}
    function setup(){buildSteps();$('mystery-choice').value=mystery;
      let saved=Number(safeStorage.get('rosary-step'));const progressVersion=safeStorage.get('rosary-progress-version');if(progressVersion!=='3'){if(Number.isFinite(saved)&&saved>0){if(progressVersion==='2'){if(saved>=8)saved--}else if(saved<=74)saved=saved<7?saved:saved+Math.floor((saved-7)/13)}safeStorage.set('rosary-progress-version','3')}if(Number.isFinite(saved)&&saved>0&&saved<steps.length){index=saved;activeNode=steps[index].node}
      const leftHanded=safeStorage.get('rosary-left-handed')==='true';$('left-handed').checked=leftHanded;$('workspace').classList.toggle('left-handed',leftHanded);$('left-handed').addEventListener('change',e=>{$('workspace').classList.toggle('left-handed',e.target.checked);safeStorage.set('rosary-left-handed',String(e.target.checked))});setTheme(safeStorage.get('rosary-theme')||'dark');$('theme-toggle').addEventListener('click',()=>{const theme=document.documentElement.dataset.theme==='dark'?'light':'dark';setTheme(theme);safeStorage.set('rosary-theme',theme)});
      const wakeButton=$('wake-toggle');if(!navigator.wakeLock||!navigator.wakeLock.request){wakeButton.disabled=true;wakeButton.setAttribute('aria-label','Screen wake lock is not supported by this browser');wakeButton.title='Screen wake lock is not supported by this browser';$('wake-status').textContent='This browser does not support keeping the screen awake.'}else{wakeButton.addEventListener('click',toggleWakeLock);document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&keepAwake&&!wakeLock)requestWakeLock()})}
      updateWakeButton();$('reset').addEventListener('click',()=>goTo(0));$('mystery-choice').addEventListener('change',e=>{mystery=e.target.value;render()});$('previous').addEventListener('click',()=>goTo(index-1));$('next').addEventListener('click',()=>goTo(index+1));$('toggle-text').addEventListener('click',()=>{textVisible=!textVisible;render()});
      document.querySelectorAll('[data-size]').forEach(b=>b.addEventListener('click',()=>{document.body.classList.remove('large','larger');if(b.dataset.size==='large')document.body.classList.add('large');if(b.dataset.size==='larger')document.body.classList.add('larger');document.querySelectorAll('[data-size]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)))}));
      document.addEventListener('keydown',e=>{if(e.altKey||e.ctrlKey||e.metaKey||['INPUT','SELECT','TEXTAREA','BUTTON'].includes(document.activeElement.tagName))return;if(e.key==='ArrowRight')goTo(index+1);if(e.key==='ArrowLeft')goTo(index-1)});window.addEventListener('resize',renderRail);render();
    }setup();
  })();
  </script>
