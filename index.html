<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080b09" id="theme-color-meta">
  <meta name="description" content="A quiet, accessible guide for praying the Rosary, on any device.">
  <title>Rosary — Prayer guide</title>
  <link rel="stylesheet" href="/src/styles.css">
</head>
<body>
  <a class="skip" href="#prayer">Skip to the prayer</a>
  <main class="wrap" id="top">
    <header class="canvas-header" aria-label="Mystery and display settings">
      <div class="canvas-header-row">
        <section class="intro" aria-label="Choose mysteries">
          <div class="mystery-line">
            <span class="mystery-label">Mysteries</span>
            <label class="mystery-choice" for="mystery-choice">
              <span class="sr-only">Choose a set of mysteries</span>
              <select id="mystery-choice">
                <option value="joyful">Joyful Mysteries</option>
                <option value="luminous">Luminous Mysteries</option>
                <option value="sorrowful">Sorrowful Mysteries</option>
                <option value="glorious">Glorious Mysteries</option>
              </select>
            </label>
          </div>
        </section>
        <div class="utility-bar">
          <div class="utility-actions">
            <button
              class="hand-toggle"
              id="left-handed-toggle"
              type="button"
              aria-pressed="false"
              aria-label="Left-handed layout disabled"
              title="Move rosary to the left side"
            >
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M7 7 3 12l4 5M17 7l4 5-4 5M3 12h7m11 0h-7" />
              </svg>
            </button>
            <button
              class="wake-toggle"
              id="wake-toggle"
              type="button"
              aria-pressed="false"
              aria-label="Keep screen awake"
              title="Keep the screen awake while praying"
            >
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <rect x="5" y="2.5" width="14" height="19" rx="2.2" />
                <path d="M9 18.5h6M12 6v5m-2-2 2 2 2-2" />
              </svg>
            </button>
            <button
              class="theme-toggle"
              id="theme-toggle"
              type="button"
              aria-pressed="true"
              aria-label="Switch to light mode"
            >
              <svg id="sun-icon" viewBox="0 0 24 24" aria-hidden="true" hidden>
                <circle cx="12" cy="12" r="4" />
                <path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l-1.42 1.42m11.3-11.3 1.42-1.42" />
              </svg>
              <svg id="moon-icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M20.5 15.5A8.5 8.5 0 0 1 8.5 3.5 8.7 8.7 0 1 0 20.5 15.5Z" />
              </svg>
            </button>
          </div>
          <span id="wake-status" class="sr-only" aria-live="polite"></span>
        </div>
      </div>
      <section class="mystery-summary" aria-live="polite" aria-atomic="true">
        <h1 id="current-mystery-title">The Resurrection</h1>
        <p id="current-mystery-description">Jesus rises from the dead.</p>
      </section>
    </header>
    <div class="workspace" id="workspace">
      <section class="panel prayer-panel" id="prayer" aria-labelledby="step-title">
        <div class="prayer-top">
          <span class="label" id="step-type">Opening prayers</span>
          <span class="progress-text" id="progress-count">1 of 75</span>
        </div>
        <div
          class="progress"
          role="progressbar"
          aria-label="Rosary progress"
          aria-valuemin="1"
          aria-valuemax="75"
          aria-valuenow="1"
        >
          <span id="progress-fill" style="width: 1.3%"></span>
        </div>
        <div id="live-step" class="prayer-scroll" tabindex="0" aria-label="Current prayer text" aria-live="polite" aria-atomic="true">
          <h2 class="prayer-title" id="step-title">Sign of the Cross</h2>
          <p class="prayer-text" id="step-text"></p>
          <div class="scripture-links hidden" id="scripture-links" aria-label="Scripture readings"></div>
        </div>
        <button class="text-toggle" id="toggle-text" type="button" aria-expanded="true">Hide prayer text</button>
        <div class="spacer"></div>
        <div class="controls">
          <button class="btn secondary" id="previous" type="button">← Previous</button>
          <button class="btn" id="next" type="button">Next prayer →</button>
        </div>
        <div class="tools">
          <div class="size-tools" role="group" aria-label="Prayer text size">
            <button type="button" data-size="normal" aria-pressed="true" aria-label="Standard prayer text size">A</button>
            <button type="button" data-size="large" aria-pressed="false" aria-label="Larger prayer text">A+</button>
            <button type="button" data-size="larger" aria-pressed="false" aria-label="Largest prayer text">A++</button>
          </div>
        </div>
      </section>
      <section class="panel rosary-panel" aria-labelledby="rosary-title">
        <div class="rail-head">
          <h2 id="rosary-title">Rosary</h2>
          <span class="rail-count" id="rail-count"></span>
        </div>
        <div class="rail-window" id="bead-rail" role="group" aria-label="Rosary beads"></div>
        <button
          class="reset-button"
          id="reset"
          type="button"
          aria-label="Reset to the Sign of the Cross"
          title="Reset to the Sign of the Cross"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 12a8 8 0 1 0 2.34-5.66L4 8" />
            <path d="M4 4v4h4" />
          </svg>
          <span>Reset</span>
        </button>
      </section>
    </div>

  </main>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
